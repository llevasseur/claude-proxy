name: Verify

# The gates `pnpm verify` chains locally, in the same order.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One step per gate, so a failure names the gate in the checks list.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check
      - run: pnpm anti:slop
