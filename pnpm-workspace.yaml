packages:
  - stacks/*/*
  # codex is not flattened the way claude's stack is: its `../scripts/run-if-present.mjs`
  # and `import.meta.dirname/../..` anchors depend on the extra level.
  - stacks/*/packages/*
  - stacks/*/apps/*
  - packages/*
  - services/*
allowBuilds:
  esbuild: true
  # wrangler's postinstall unpacks the workerd binary `wrangler dev` runs on.
  workerd: true
